[project]
name = "rpa-ready-document-processing-pipeline"
version = "0.1.0"
description = "Production-style document processing, validation, exception-routing, and RPA-ready output pipeline."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pandas>=2.2.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "sqlalchemy>=2.0.0",
  "python-multipart>=0.0.9",
  "pdfplumber>=0.11.0",
  "great-expectations>=0.18.0",
  "jinja2>=3.1.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
  "rapidfuzz>=3.9.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "httpx>=0.27.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
